<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="245" viewBox="0 0 1200 245" role="img" aria-labelledby="t d"><title id="t">Clinic Queue and Patient Flow Manager</title><desc id="d">A role-based clinic workflow demo that organizes virtual visits, queue tokens, estimated waiting times, staff visibility, and doctor flow using sample session data.</desc><defs><linearGradient id="edge" x1="0" x2="1"><stop stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2230"/><stop offset="1" stop-color="#10152a"/></linearGradient></defs><rect x="1" y="1" width="1198" height="243" rx="17" fill="url(#wash)" stroke="#264458"/><rect x="1" y="1" width="6" height="243" rx="3" fill="url(#edge)"/><text x="34" y="37" fill="#5eead4" font-family="ui-monospace,monospace" font-size="12" letter-spacing="2">01 · WEB APPLICATION · JAVASCRIPT</text><text x="34" y="78" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="700">Clinic Queue &amp; Patient Flow</text><text x="34" y="109" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">A role-based demo to bring order and clearer waiting times to clinic visits.</text><g font-family="Arial,sans-serif" font-size="13"><rect x="34" y="133" width="300" height="33" rx="8" fill="#102b36" stroke="#1c4b54"/><text x="49" y="154" fill="#99f6e4">PATIENT · token &amp; estimated wait</text><rect x="345" y="133" width="286" height="33" rx="8" fill="#171a35" stroke="#302c60"/><text x="360" y="154" fill="#c4b5fd">STAFF · queue &amp; patient load</text><rect x="642" y="133" width="282" height="33" rx="8" fill="#122738" stroke="#244863"/><text x="657" y="154" fill="#93c5fd">DOCTOR · serve patients in order</text></g><text x="34" y="207" fill="#64748b" font-family="ui-monospace,monospace" font-size="12">RULE-BASED QUEUE · SIMULATED DATA · PRIVACY-CONSCIOUS DEMO</text><g transform="translate(1004 72)"><rect width="154" height="111" rx="12" fill="#09101a" stroke="#31435a"/><text x="16" y="27" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="10">NOW SERVING</text><text x="16" y="73" fill="#5eead4" font-family="ui-monospace,monospace" font-size="34" font-weight="700">#08</text><circle cx="128" cy="21" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle><path d="M16 91H138" stroke="#26354a"/><text x="16" y="105" fill="#64748b" font-family="ui-monospace,monospace" font-size="9">QUEUE UPDATED</text></g></svg>
