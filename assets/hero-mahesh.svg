<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">S Mahesh Babu — Full-Stack Developer and AI Builder</title>
  <desc id="hero-desc">Animated engineering portfolio header with code, an orbital portrait frame, floating particles, an animated light sweep, and subtle lightning.</desc>
  <defs>
    <radialGradient id="hero-bg" cx="72%" cy="38%" r="80%"><stop stop-color="#24101a"/><stop offset=".55" stop-color="#130d16"/><stop offset="1" stop-color="#0c0a10"/></radialGradient>
    <radialGradient id="hero-light-a"><stop stop-color="#a43d63" stop-opacity=".55"/><stop offset="1" stop-color="#701a3d" stop-opacity="0"/></radialGradient>
    <radialGradient id="hero-light-b"><stop stop-color="#e3a276" stop-opacity=".2"/><stop offset="1" stop-color="#e3a276" stop-opacity="0"/></radialGradient>
    <linearGradient id="hero-name" x1="60" x2="730"><stop stop-color="#fff5f7"/><stop offset=".56" stop-color="#e5b5c7"/><stop offset="1" stop-color="#c77b9b"/></linearGradient>
    <linearGradient id="hero-sheen" x1="-260" x2="-40"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/><animateTransform attributeName="gradientTransform" type="translate" values="0 0;820 0;820 0" keyTimes="0;.35;1" dur="8s" begin="3s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="hero-rule" x1="0" x2="1"><stop stop-color="#c77b9b" stop-opacity="0"/><stop offset=".2" stop-color="#e5b5c7"/><stop offset=".75" stop-color="#701a3d"/><stop offset="1" stop-color="#701a3d" stop-opacity="0"/></linearGradient>
    <linearGradient id="hero-orbit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5b5c7" stop-opacity=".6"/><stop offset="1" stop-color="#701a3d" stop-opacity=".05"/></linearGradient>
    <linearGradient id="hero-grid-line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e5b5c7" stop-opacity="0"/><stop offset=".5" stop-color="#e5b5c7" stop-opacity=".07"/><stop offset="1" stop-color="#e5b5c7" stop-opacity="0"/></linearGradient>
    <pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c77b9b" stroke-opacity=".06"/></pattern>
    <filter id="hero-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="hero-clip"><rect width="1200" height="480" rx="20"/></clipPath>
    <clipPath id="portrait-clip"><path d="M847 380V202a118 118 0 0 1 236 0v178z"/></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.serif{font-family:Georgia,"Iowan Old Style","Times New Roman",serif}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    .rise{animation:rise 1.35s cubic-bezier(.16,1,.3,1) both}.fade{animation:fade 1.4s ease both}.d1{animation-delay:.15s}.d2{animation-delay:.4s}.d3{animation-delay:.7s}.d4{animation-delay:1s}.d5{animation-delay:1.3s}
    .draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.4s cubic-bezier(.65,0,.35,1) .9s forwards}.portrait{animation:rise 1.5s cubic-bezier(.16,1,.3,1) .5s both}.trace{stroke-dasharray:440 1960;stroke-dashoffset:2400;animation:trace 7s linear infinite}
    @keyframes rise{from{opacity:0;transform:translateY(17px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes trace{to{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){.rise,.fade,.portrait{animation:none}.draw{animation:none;stroke-dashoffset:0}.trace{display:none}}
  </style>
  <g clip-path="url(#hero-clip)">
    <rect width="1200" height="480" fill="url(#hero-bg)"/><rect width="1200" height="480" fill="url(#hero-grid)"/>
    <ellipse cx="900" cy="140" rx="420" ry="300" fill="url(#hero-light-a)"><animateTransform attributeName="transform" type="translate" values="0 0;-60 30;0 0" dur="22s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="180" cy="460" rx="360" ry="220" fill="url(#hero-light-b)"><animateTransform attributeName="transform" type="translate" values="0 0;70 -25;0 0" dur="28s" repeatCount="indefinite"/></ellipse>
    <rect x="0" y="-140" width="1200" height="140" fill="url(#hero-grid-line)"><animate attributeName="y" values="-140;480" dur="11s" begin="2s" repeatCount="indefinite"/></rect>
    <g fill="#e5b5c7"><circle cx="560" cy="120" r="1.4"><animate attributeName="opacity" values="0;.9;0" dur="4.2s" repeatCount="indefinite"/><animate attributeName="cy" values="120;96" dur="4.2s" repeatCount="indefinite"/></circle><circle cx="700" cy="70" r="1.1"><animate attributeName="opacity" values="0;.8;0" dur="5.6s" begin="1s" repeatCount="indefinite"/><animate attributeName="cy" values="70;48" dur="5.6s" begin="1s" repeatCount="indefinite"/></circle><circle cx="1120" cy="380" r="1.6"><animate attributeName="opacity" values="0;.9;0" dur="4.8s" begin="2s" repeatCount="indefinite"/><animate attributeName="cy" values="380;352" dur="4.8s" begin="2s" repeatCount="indefinite"/></circle><circle cx="760" cy="420" r="1.2"><animate attributeName="opacity" values="0;.7;0" dur="6s" begin=".5s" repeatCount="indefinite"/><animate attributeName="cy" values="420;396" dur="6s" begin=".5s" repeatCount="indefinite"/></circle></g>
    <g transform="translate(965 232)" class="fade d3"><circle r="212" fill="none" stroke="#c77b9b" stroke-opacity=".1" stroke-dasharray="1 10"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="140s" repeatCount="indefinite"/></circle><circle r="190" fill="none" stroke="url(#hero-orbit)"/><circle r="160" fill="none" stroke="#c77b9b" stroke-opacity=".16" stroke-dasharray="2 7"/><g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="95s" repeatCount="indefinite"/><circle cy="160" r="2.5" fill="#fff5f7"/><circle cx="-160" r="2" fill="#c77b9b"/></g></g>
    <g class="portrait"><path d="M835 392V202a130 130 0 0 1 260 0v190z" fill="none" stroke="#c77b9b" stroke-opacity=".35"><animate attributeName="stroke-opacity" values=".15;.5;.15" dur="5s" repeatCount="indefinite"/></path><g clip-path="url(#portrait-clip)"><rect x="847" y="84" width="236" height="296" fill="#2a101c"/><text x="965" y="255" text-anchor="middle" fill="#e5b5c7" font-family="Georgia,serif" font-size="110">MB</text><image href="https://avatars.githubusercontent.com/u/209448823?v=4" x="847" y="84" width="236" height="296" preserveAspectRatio="xMidYMid slice"/></g><path class="draw" d="M847 380V202a118 118 0 0 1 236 0v178z" fill="none" stroke="#e5b5c7" stroke-width="1.5"/><path d="M829 290v-22h22M1101 398v-22m0 22h-22" fill="none" stroke="#e5b5c7" stroke-opacity=".8"/></g>
    <g transform="translate(72 64)" class="fade d1"><rect width="322" height="34" rx="17" fill="#190b12" stroke="#c77b9b" stroke-opacity=".3"/><circle cx="20" cy="17" r="4" fill="#c77b9b"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle><text class="mono" x="34" y="21.5" font-size="12" fill="#b6a3ac">~/mahesh <tspan fill="#c77b9b">$ </tspan><tspan fill="#f8f0f3">build --impact</tspan></text><rect x="300" y="10" width="7" height="14" fill="#e5b5c7"><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.5;.5;1" dur="1.1s" repeatCount="indefinite"/></rect></g>
    <g class="rise d2"><line x1="72" y1="136" x2="104" y2="136" stroke="#c77b9b"/><text class="mono" x="116" y="140" font-size="12.5" letter-spacing="3.4" fill="#c77b9b">FULL-STACK · AI · PRODUCT BUILDING</text></g>
    <text class="serif rise d3" x="68" y="230" font-size="86" font-weight="300" letter-spacing="-2.5" fill="url(#hero-name)">S Mahesh Babu</text>
    <g class="fade d5" pointer-events="none"><text class="serif" x="68" y="230" font-size="86" font-weight="300" letter-spacing="-2.5" fill="url(#hero-sheen)">S Mahesh Babu</text></g>
    <path class="draw" d="M72 270C220 264 420 276 650 266" fill="none" stroke="url(#hero-rule)" stroke-width="2" stroke-linecap="round" filter="url(#hero-glow)"/>
    <text class="mono rise d4" x="72" y="318" font-size="13" letter-spacing="2.4" fill="#f8f0f3">B.TECH COMPUTER SCIENCE  ·  DEVELOPER</text>
    <text class="serif rise d5" x="72" y="356" font-size="21" font-style="italic" fill="#b6a3ac">Building useful things. Learning with every release.</text>
    <g class="fade d5"><line x1="72" y1="411" x2="1128" y2="411" stroke="#c77b9b" stroke-opacity=".18"/><text class="mono" x="72" y="446" font-size="10.5" letter-spacing="2" fill="#b6a3ac">JAVASCRIPT · TYPESCRIPT · REACT · PYTHON</text><text class="mono" x="1128" y="446" text-anchor="end" font-size="10.5" letter-spacing="2" fill="#e5b5c7">REAL PROJECTS · PRACTICAL AI</text></g>
    <g fill="none" stroke="#f2c5d6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#hero-glow)"><path d="m894 127-9 17h9l-5 12 16-20h-10l6-9z" opacity="0"><animate attributeName="opacity" values="0;0;.9;.2;0;0" keyTimes="0;.08;.12;.17;.23;1" dur="5.8s" repeatCount="indefinite"/></path><path d="m1123 181-8 15h8l-4 11 14-18h-9l5-8z" opacity="0"><animate attributeName="opacity" values="0;0;.85;.15;0;0" keyTimes="0;.36;.4;.45;.51;1" dur="6.4s" repeatCount="indefinite"/></path><path d="m869 271-7 13h7l-4 10 13-16h-8l5-7z" opacity="0"><animate attributeName="opacity" values="0;0;1;.18;0;0" keyTimes="0;.68;.72;.77;.83;1" dur="7.1s" repeatCount="indefinite"/></path></g>
    <circle cx="600" cy="342" r="3" fill="#fff5f7" filter="url(#hero-glow)"><animateMotion dur="5s" repeatCount="indefinite" begin="4.4s" path="M600 342C680 338 740 330 780 318S828 300 847 300"/></circle>
    <rect class="trace" x=".5" y=".5" width="1199" height="479" rx="19.5" fill="none" stroke="#e5b5c7" stroke-opacity=".45" stroke-width="1.2"/>
  </g>
</svg>
