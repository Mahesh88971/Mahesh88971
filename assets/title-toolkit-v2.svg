<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" role="img" aria-labelledby="t"><title id="t">04 Toolkit — The tools I reach for.</title><defs><linearGradient id="line" x1="0" x2="1"><stop stop-color="#c77b9b"/><stop offset=".6" stop-color="#701a3d"/><stop offset="1" stop-color="#701a3d" stop-opacity="0"/></linearGradient></defs><style>.m{font-family:ui-monospace,monospace}.s{font-family:Georgia,"Times New Roman",serif}.in{animation:in 1.1s cubic-bezier(.16,1,.3,1) both}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.in{animation:none}}</style><g class="in"><text class="m" x="40" y="34" font-size="12" letter-spacing="3" fill="#c77b9b"><tspan fill="#e5b5c7">04</tspan> · TOOLKIT</text><text class="s" x="38" y="84" font-size="44" font-weight="300" fill="#f8f0f3">The tools I <tspan font-style="italic" fill="#e5b5c7">reach for.</tspan></text><text class="m" x="1160" y="34" text-anchor="end" font-size="10.5" letter-spacing="2.4" fill="#b6a3ac">STACK</text></g><path d="M40 106H1160" stroke="url(#line)"/><path d="M40 106H1160" stroke="#e5b5c7" stroke-opacity=".35" stroke-dasharray="3 12"><animate attributeName="stroke-dashoffset" from="0" to="-60" dur="5s" repeatCount="indefinite"/></path></svg>