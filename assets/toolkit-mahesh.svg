12" fill-opacity=".88" stroke="#c77b9b" stroke-opacity=".3"/><rect class="trace" style="animation-delay:-2.3s" width="360" height="200" rx="14" fill="none" stroke="url(#trace)" stroke-width="1.4"/><text class="mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#c77b9b">03 · STYLING</text><text class="serif" x="24" y="96" font-size="38" fill="#f8f0f3">Tailwind CSS</text><text class="serif" x="24" y="143" font-size="26" fill="#b6a3ac">Responsive UI</text><text class="mono" x="24" y="178" font-size="11" letter-spacing="1.2" fill="#b6a3ac">DESIGN · ACCESSIBILITY</text></g><g class="panel p4" transform="translate(32 268)"><rect width="360" height="200" rx="14" fill="#190b12" fill-opacity=".88" stroke="#c77b9b" stroke-opacity=".3"/><rect class="trace" style="animation-delay:-3.45s" width="360" height="200" rx="14" fill="none" stroke="url(#trace)" stroke-width="1.4"/><text class="mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#c77b9b">04 · DATA</text><text class="serif" x="24" y="96" font-size="36" fill="#f8f0f3">SQLite</text><text class="serif" x="24" y="141" font-size="27" fill="#b6a3ac">Session data</text><text class="mono" x="24" y="178" font-size="11" letter-spacing="1.2" fill="#b6a3ac">PERSISTENCE · DEMO WORKFLOWS</text></g><g class="panel p5" transform="translate(420 268)"><rect width="360" height="200" rx="14" fill="#190b12" fill-opacity=".88" stroke="#c77b9b" stroke-opacity=".3"/><rect class="trace" style="animation-delay:-4.6s" width="360" height="200" rx="14" fill="none" stroke="url(#trace)" stroke-width="1.4"/><text class="mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#c77b9b">05 · PRODUCT WORK</text><text class="serif" x="24" y="96" font-size="36" fill="#f8f0f3">Web apps</text><text class="serif" x="24" y="141" font-size="26" fill="#b6a3ac">Flows · forms · dashboards</text><text class="mono" x="24" y="178" font-size="11" letter-spacing="1.2" fill="#b6a3ac">FROM INTERFACE TO WORKFLOW</text></g><g class="panel p6" transform="translate(808 268)"><rect width="360" height="200" rx="14" fill="#190b12" fill-opacity=".88" stroke="#c77b9b" stroke-opacity=".3"/><rect class="trace" style="animation-delay:-5.75s" width="360" height="200" rx="14" fill="none" stroke="url(#trace)" stroke-width="1.4"/><text class="mono" x="24" y="38" font-size="11" letter-spacing="2.4" fill="#c77b9b">06 · TOOLS</text><text class="serif" x="24" y="96" font-size="36" fill="#f8f0f3">Git · GitHub</text><text class="serif" x="24" y="141" font-size="25" fill="#b6a3ac">Version control · collaboration</text><text class="mono" x="24" y="178" font-size="11" letter-spacing="1.2" fill="#b6a3ac">SMALL STEPS · VISIBLE PROGRESS</text></g></svg>