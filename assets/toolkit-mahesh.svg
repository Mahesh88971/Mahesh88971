<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d"><title id="t">Technology toolkit</title><desc id="d">Technologies visible across Mahesh's public portfolio projects: JavaScript, TypeScript, React, HTML, CSS, Tailwind CSS, Python, SQLite, Git and GitHub.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#190b12"/><stop offset="1" stop-color="#10070c"/></linearGradient><radialGradient id="glow"><stop stop-color="#451126" stop-opacity=".8"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient><radialGradient id="pulse"><stop stop-color="#fff5f7"/><stop offset=".5" stop-color="#e5b5c7" stop-opacity=".6"/><stop offset="1" stop-color="#c77b9b" stop-opacity="0"/></radialGradient><linearGradient id="trace" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5f7"/><stop offset=".45" stop-color="#e5b5c7"/><stop offset="1" stop-color="#c77b9b" stop-opacity="0"/></linearGradient></defs><style>.serif{font-family:Georgia,"Times New Roman",serif}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.panel{animation:in 1.1s cubic-bezier(.16,1,.3,1) both}.p1{animation-delay:.05s}.p2{animation-delay:.2s}.p3{animation-delay:.35s}.p4{animation-delay:.5s}.p5{animation-delay:.65s}.p6{animation-delay:.8s}.web{stroke-dasharray:1800;stroke-dashoffset:1800;animation:draw 3s cubic-bezier(.65,0,.35,1) 1s forwards}.trace{stroke-dasharray:201 1120;stroke-dashoffset:1321;animation:trace 7s linear infinite}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes trace{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.panel{animation:none}.web{animation:none;stroke-dashoffset:0}.trace{display:none}}</style><rect width="1200" height="500" rx="20" fill="url(#bg)"/><rect width="1200" height="500" rx="20" fill="url(#glow)"/><rect x=".5" y=".5" width="1199" height="499" rx="19.5" fill="none