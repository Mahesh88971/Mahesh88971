<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="t d"><title id="t">Learning and building focus</title><desc id="d">Three focus pillars: product-minded web applications, practical AI integration, and continuous project-based learning.</desc><defs><linearGradient id="line" x1="0" x2="1"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#818cf8"/></linearGradient></defs><rect x="1" y="1" width="1198" height="188" rx="14" fill="#0b1020" stroke="#25314b"/><path d="M190 82H1010" stroke="url(#line)" stroke-opacity=".35" stroke-width="2" stroke-dasharray="7 8"><animate attributeName="stroke-dashoffset" from="0" to="-30" dur="3s" repeatCount="indefinite"/></path><g font-family="Arial,sans-serif"><circle cx="205" cy="82" r="24" fill="#102a31" stroke="#2dd4bf"/><text x="205" y="88" fill="#5eead4" font-size="16" font-weight="700" text-anchor="middle">01</text><text x="205" y="132" fill="#f1f5f9" font-size="17" font-weight="700" text-anchor="middle">WEB THAT WORKS</text><text x="205" y="156" fill="#94a3b8" font-size="13" text-anchor="middle">Usable, polished experiences</text><circle cx="600" cy="82" r="24" fill="#1c1837" stroke="#818cf8"/><text x="600" y="88" fill="#c4b5fd" font-size="16" font-weight="700" text-anchor="middle">02</text><text x="600" y="132" fill="#f1f5f9" font-size="17" font-weight="700" text-anchor="middle">PRACTICAL AI</text><text x="600" y="156" fill="#94a3b8" font-size="13" text-anchor="middle">Thoughtful integration, real value</text><circle cx="995" cy="82" r="24" fill="#102a31" stroke="#2dd4bf"/><text x="995" y="88" fill="#5eead4" font-size="16" font-weight="700" text-anchor="middle">03</text><text x="995" y="132" fill="#f1f5f9" font-size="17" font-weight="700" text-anchor="middle">BUILD &amp; LEARN</text><text x="995" y="156" fill="#94a3b8" font-size="13" text-anchor="middle">Grow through hands-on projects</text></g></svg>
