<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">S Mahesh Babu — Full-Stack Developer</title>
  <desc id="desc">A dark, animated gradient banner introducing a computer science student focused on full-stack development and AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="55%" stop-color="#101a32" />
      <stop offset="100%" stop-color="#11102b" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="52%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#6366f1" stop-opacity=".35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34" /></filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)" />
  <circle cx="1010" cy="64" r="145" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="1010;940;1010" dur="9s" repeatCount="indefinite" />
  </circle>
  <circle cx="210" cy="300" r="110" fill="#14b8a6" opacity=".1" filter="url(#blur)">
    <animate attributeName="cy" values="300;255;300" dur="7s" repeatCount="indefinite" />
  </circle>
  <path d="M0 245 C220 205 330 300 550 250 S910 190 1200 245" fill="none" stroke="url(#accent)" stroke-opacity=".22" stroke-width="1.5" />
  <path d="M0 265 C230 225 360 315 590 265 S960 205 1200 260" fill="none" stroke="url(#accent)" stroke-opacity=".12" stroke-width="1" />
  <rect x="72" y="67" width="4" height="186" rx="2" fill="url(#accent)" />
  <text x="104" y="132" fill="#a5b4fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="3">HELLO, WORLD — I'M</text>
  <text x="100" y="194" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="52" font-weight="750" letter-spacing="-1.6">S MAHESH BABU</text>
  <rect x="104" y="213" width="12" height="25" rx="2" fill="#5eead4">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
  </rect>
  <text x="130" y="233" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" letter-spacing=".4">B.Tech Computer Science  ·  Full-Stack Development  ·  AI</text>
  <g fill="#dbeafe" opacity=".65">
    <circle cx="1040" cy="103" r="2"><animate attributeName="opacity" values=".25;.9;.25" dur="3s" repeatCount="indefinite" /></circle>
    <circle cx="1082" cy="150" r="1.5"><animate attributeName="opacity" values=".9;.2;.9" dur="4s" repeatCount="indefinite" /></circle>
    <circle cx="990" cy="189" r="2"><animate attributeName="opacity" values=".3;1;.3" dur="3.5s" repeatCount="indefinite" /></circle>
    <circle cx="1130" cy="80" r="1.5"><animate attributeName="opacity" values=".8;.2;.8" dur="2.8s" repeatCount="indefinite" /></circle>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#94a3b8" stroke-opacity=".18" />
</svg>