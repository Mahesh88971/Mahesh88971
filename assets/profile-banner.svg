<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">S Mahesh Babu — Full-Stack Developer and AI Builder</title>
  <desc id="desc">Original animated dark navy and teal terminal-inspired profile header with Mahesh's portrait and animated code motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b15"/><stop offset=".52" stop-color="#11152a"/><stop offset="1" stop-color="#101b2c"/></linearGradient>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#5eead4"/><stop offset=".55" stop-color="#60a5fa"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <linearGradient id="portraitBorder" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#14b8a6" stop-opacity=".32"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#94a3b8" stroke-opacity=".055" stroke-width="1"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="boltGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.5" result="blurred"/><feMerge><feMergeNode in="blurred"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="410" rx="25" fill="url(#bg)"/>
  <rect width="1200" height="410" rx="25" fill="url(#grid)"/>
  <circle cx="1040" cy="85" r="200" fill="url(#glow)" filter="url(#blur)"><animate attributeName="cx" values="1040;925;1040" dur="10s" repeatCount="indefinite"/></circle>
  <circle cx="180" cy="405" r="190" fill="#6366f1" opacity=".12" filter="url(#blur)"><animate attributeName="cy" values="405;350;405" dur="8s" repeatCount="indefinite"/></circle>
  <rect x="1" y="1" width="1198" height="408" rx="24" fill="none" stroke="#64748b" stroke-opacity=".3"/>
  <rect x="2" y="2" width="1196" height="3" rx="1.5" fill="url(#edge)"/>
  <rect x="35" y="28" width="1130" height="34" rx="9" fill="#080b13" fill-opacity=".74" stroke="#334155" stroke-opacity=".6"/>
  <circle cx="56" cy="45" r="5" fill="#fb7185"/><circle cx="74" cy="45" r="5" fill="#fbbf24"/><circle cx="92" cy="45" r="5" fill="#5eead4"/>
  <text x="115" y="50" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="13">mahesh@github <tspan fill="#5eead4">~</tspan> /profile</text>
  <g font-family="ui-monospace,monospace" font-size="13" opacity=".56">
    <text x="820" y="117" fill="#5eead4">const</text><text x="865" y="117" fill="#c4b5fd"> builder</text><text x="928" y="117" fill="#e2e8f0"> = {</text>
    <text x="840" y="144" fill="#93c5fd">focus:</text><text x="891" y="144" fill="#fda4af"> "web + AI",</text>
    <text x="840" y="171" fill="#93c5fd">mindset:</text><text x="904" y="171" fill="#fda4af"> "learn by building"</text>
    <text x="820" y="198" fill="#e2e8f0">};</text>
  </g>
  <text x="83" y="131" fill="#5eead4" font-family="ui-monospace,monospace" font-size="14" letter-spacing="3">B.TECH COMPUTER SCIENCE  ·  DEVELOPER</text>
  <text x="78" y="195" fill="#f8fafc" font-family="Arial,sans-serif" font-size="53" font-weight="700" letter-spacing="-1.6">S MAHESH BABU</text>
  <rect x="83" y="221" width="3" height="26" rx="1.5" fill="#5eead4"><animate attributeName="opacity" values="1;.12;1" dur="1.1s" repeatCount="indefinite"/></rect>
  <text x="101" y="240" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="19">Full-stack development · AI integration · useful products</text>
  <rect x="83" y="276" width="442" height="37" rx="18.5" fill="#101f2a" stroke="#2dd4bf" stroke-opacity=".5"/>
  <circle cx="103" cy="294" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="119" y="299" fill="#99f6e4" font-family="ui-monospace,monospace" font-size="13" letter-spacing="1">CURIOUS ABOUT WHAT'S NEXT</text>
  <circle cx="1010" cy="205" r="105" fill="#0a101d" stroke="url(#portraitBorder)" stroke-width="3"/>
  <circle cx="1010" cy="205" r="83" fill="#111a2b" stroke="#334155" stroke-width="1"/>
  <circle cx="1010" cy="205" r="72" fill="none" stroke="#5eead4" stroke-opacity=".22" stroke-dasharray="4 9"><animateTransform attributeName="transform" type="rotate" from="0 1010 205" to="360 1010 205" dur="28s" repeatCount="indefinite"/></circle>
  <text x="1010" y="196" fill="#5eead4" font-family="ui-monospace,monospace" font-size="38" font-weight="700" text-anchor="middle">&lt;/&gt;</text>
  <text x="1010" y="227" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1" text-anchor="middle">BUILD · LEARN</text>
  <circle cx="1010" cy="205" r="119" fill="none" stroke="#5eead4" stroke-opacity=".28" stroke-width="1"><animate attributeName="r" values="119;124;119" dur="4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".28;.06;.28" dur="4s" repeatCount="indefinite"/></circle>
  <g fill="none" stroke="#99f6e4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#boltGlow)">
    <path d="m894 127-9 17h9l-5 12 16-20h-10l6-9z" opacity="0"><animate attributeName="opacity" values="0;0;.9;.2;0;0" keyTimes="0;.08;.12;.17;.23;1" dur="5.8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 -3;0 0;0 -3" dur="5.8s" repeatCount="indefinite"/></path>
    <path d="m1123 181-8 15h8l-4 11 14-18h-9l5-8z" opacity="0"><animate attributeName="opacity" values="0;0;.85;.15;0;0" keyTimes="0;.36;.4;.45;.51;1" dur="6.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0 2;0 0;0 2" dur="6.4s" repeatCount="indefinite"/></path>
    <path d="m869 271-7 13h7l-4 10 13-16h-8l5-7z" opacity="0"><animate attributeName="opacity" values="0;0;1;.18;0;0" keyTimes="0;.68;.72;.77;.83;1" dur="7.1s" repeatCount="indefinite"/></path>
  </g>
  <rect x="866" y="331" width="288" height="42" rx="12" fill="#0a0f1b" stroke="#334155"/>
  <text x="1010" y="357" text-anchor="middle" fill="#cbd5e1" font-family="ui-monospace,monospace" font-size="12" letter-spacing="1.5">IDEA → CODE → IMPACT</text>
  <g fill="#dbeafe"><circle cx="1138" cy="92" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle><circle cx="783" cy="241" r="1.7"><animate attributeName="opacity" values="1;.2;1" dur="3.8s" repeatCount="indefinite"/></circle><circle cx="1136" cy="278" r="2"><animate attributeName="opacity" values=".3;1;.3" dur="2.7s" repeatCount="indefinite"/></circle></g>
</svg>
