<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 325" width="1200" height="325" role="img" aria-labelledby="h d"><title id="h">Builder's highlights</title><desc id="d">Three confirmed highlights: computer science studies, full-stack and AI exploration, and hands-on projects focused on practical workflows.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#190b12"/><stop offset="1" stop-color="#10070c"/></linearGradient><radialGradient id="glow" cx="90%"><stop stop-color="#701a3d" stop-opacity=".55"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient><linearGradient id="trace" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5f7"/><stop offset=".45" stop-color="#e5b5c7"/><stop offset="1" stop-color="#c77b9b" stop-opacity="0"/></linearGradient></defs><style>.mono{font-family:ui-monospace,monospace}.serif{font-family:Georgia,"Times New Roman",serif}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.card{animation:in 1.1s cubic-bezier(.16,1,.3,1) both}.d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.trace{stroke-dasharray:240 1200;stroke-dashoffset:1440;animation:trace 6s linear infinite}@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes trace{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.card{animation:none}.trace{display:none}}</style><rect width="1200" height="325" rx="20" fill="url(#bg)"/><rect width="1200" height="325" rx="20" fill="url(#glow)"/><rect x=".5" y=".5" width="1199" height="324" rx="19.5" fill="none" stroke="#c77b9b" stroke-opacity=".18"/><g class="card d1" transform="translate(24 24)"><rect width="365" height="275" rx="16" fill="#190b12" stroke="#c77b9b" stroke-opacity=".34"/><rect class="trace" width="365" height="275" rx="16" fill="none" stroke="url(#trace)" stroke-width="1.7"/><text class="serif" x="340" y="123" text-anchor="end" font-size="112" fill="#e5b5c7" opacity=".1">01</text><text class="mono" x="30" y="51" font-size="11" letter-spacing="2.4" fill="#c77b9b">STUDYING</text><text class="serif" x="30" y="116" font-size="34" fill="#f8f0f3">Computer Science</text><path d="M30 148h300" stroke="#c77b9b" stroke-opacity=".3"/><text class="sans" x="30" y="188" font-size="15" fill="#b6a3ac">B.Tech student learning the foundations</text><text class="sans" x="30" y="214" font-size="15" fill="#b6a3ac">behind software, systems and the web.</text><text class="mono" x="30" y="249" font-size="10" letter-spacing="1.4" fill="#e5b5c7">FOUNDATIONS → PRACTICE</text></g><g class="card d2" transform="translate(418 24)"><rect width="365" height="275" rx="16" fill="#190b12" stroke="#c77b9b" stroke-opacity=".34"/><rect class="trace" style="animation-delay:-2s" width="365" height="275" rx="16" fill="none" stroke="url(#trace)" stroke-width="1.7"/><text class="serif" x="340" y="123" text-anchor="end" font-size="112" fill="#e5b5c7" opacity=".1">02</text><text class="mono" x="30" y="51" font-size="11" letter-spacing="2.4" fill="#c77b9b">EXPLORING</text><text class="serif" x="30" y="116" font-size="34" fill="#f8f0f3">Full-stack + AI</text><path d="M30 148h300" stroke="#c77b9b" stroke-opacity=".3"/><text class="sans" x="30" y="188" font-size="15" fill="#b6a3ac">From front-end interactions to practical</text><text class="sans" x="30" y="214" font-size="15" fill="#b6a3ac">AI experiments and backend workflows.</text><text class="mono" x="30" y="249" font-size="10" letter-spacing="1.4" fill="#e5b5c7">UI · API · INTELLIGENT FEATURES</text></g><g class="card d3" transform="translate(812 24)"><rect width="365" height="275" rx="16" fill="#190b12" stroke="#c77b9b" stroke-opacity=".34"/><rect class="trace" style="animation-delay:-4s" width="365" height="275" rx="16" fill="none" stroke="url(#trace)" stroke-width="1.7"/><text class="serif" x="340" y="123" text-anchor="end" font-size="112" fill="#e5b5c7" opacity=".1">03</text><text class="mono" x="30" y="51" font-size="11" letter-spacing="2.4" fill="#c77b9b">MAKING</text><text class="serif" x="30" y="116" font-size="34" fill="#f8f0f3">Useful projects</text><path d="M30 148h300" stroke="#c77b9b" stroke-opacity=".3"/><text class="sans" x="30" y="188" font-size="15" fill="#b6a3ac">Build from real user workflows and keep</text><text class="sans" x="30" y="214" font-size="15" fill="#b6a3ac">the product clear, thoughtful and usable.</text><text class="mono" x="30" y="249" font-size="10" letter-spacing="1.4" fill="#e5b5c7">IDEA → INTERFACE → ITERATION</text></g></svg>