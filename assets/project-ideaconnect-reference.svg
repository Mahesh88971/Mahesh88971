<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-labelledby="t d"><title id="t">Idea Connect</title><desc id="d">Mahesh's TypeScript project. Visit the repository for implementation details.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#190b12"/><stop offset="1" stop-color="#10070c"/></linearGradient><radialGradient id="glow" cx="82%" cy="30%" r="55%"><stop stop-color="#701a3d" stop-opacity=".62"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient><linearGradient id="trace" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5f7"/><stop offset=".45" stop-color="#e5b5c7"/><stop offset="1" stop-color="#c77b9b" stop-opacity="0"/></linearGradient></defs><style>.serif{font-family:Georgia,"Times New Roman",serif}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.in{animation:in 1.2s cubic-bezier(.16,1,.3,1) both}.trace{stroke-dasharray:440 1960;stroke-dashoffset:2400;animation:trace 7s linear infinite}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes trace{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.in{animation:none}.trace{display:none}}</style><g><rect width="1200" height="290" rx="18" fill="url(#bg)"/><rect width="1200" height="290" rx="18" fill="url(#glow)"/><g class="in"><text class="mono" x="56" y="64" font-size="12" letter-spacing="2.6" fill="#c77b9b">04 · TYPESCRIPT PROJECT</text><text class="serif" x="54" y="127" font-size="50" font-weight="300" fill="#f8f0f3">Idea Connect</text><text class="sans" x="56" y="170" font-size="16" fill="#b6a3ac">A project from my TypeScript work. Open the repository to explore</text><text class="sans" x="56" y="195" font-size="16" fill="#b6a3ac">its current implementation and details.</text><path d="M56 222H655" stroke="#c77b9b" stroke-opacity=".45" stroke-dasharray="600" stroke-dashoffset="600"><animate attributeName="stroke-dashoffset" to="0" dur="2s" fill="freeze"/></path><text class="mono" x="56" y="257" font-size="11" fill="#e5b5c7">OPEN SOURCE · TYPESCRIPT</text></g><g transform="translate(884 133)" fill="none" stroke="#e5b5c7" stroke-width="2"><path d="M-105 0h210M-55-64 0 0l55-64M-55 64 0 0l55 64" stroke-opacity=".55" stroke-dasharray="6 7"><animate attributeName="stroke-dashoffset" from="0" to="-26" dur="3s" repeatCount="indefinite"/></path><circle cx="-105" r="14" fill="#190b12"/><circle cx="0" r="25" fill="#451126" stroke="#e5b5c7"><animate attributeName="r" values="23;27;23" dur="3s" repeatCount="indefinite"/></circle><circle cx="105" r="14" fill="#190b12"/><circle cx="-55" cy="-64" r="12" fill="#190b12"/><circle cx="55" cy="-64" r="12" fill="#190b12"/><circle cx="-55" cy="64" r="12" fill="#190b12"/><circle cx="55" cy="64" r="12" fill="#190b12"/><circle r="4" fill="#fff5f7" stroke="none"><animateMotion dur="4s" repeatCount="indefinite" path="M-105 0H105"/></circle></g><rect x=".5" y=".5" width="1199" height="289" rx="17.5" fill="none" stroke="#c77b9b" stroke-opacity=".2"/><rect class="trace" x=".5" y=".5" width="1199" height="289" rx="17.5" fill="none" stroke="url(#trace)" stroke-width="1.6"/></g></svg>