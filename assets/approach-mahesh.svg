<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="t d"><title id="t">How I like to work</title><desc id="d">Three personal principles: understand the problem, build a useful and clear experience, and learn from real implementation feedback.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#190b12"/><stop offset="1" stop-color="#10070c"/></linearGradient><linearGradient id="trace" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5f7"/><stop offset=".45" stop-color="#e5b5c7"/><stop offset="1" stop-color="#c77b9b" stop-opacity="0"/></linearGradient><linearGradient id="wire" x1="0" x2="1"><stop stop-color="#701a3d"/><stop offset=".5" stop-color="#e5b5c7"/><stop offset="1" stop-color="#701a3d"/></linearGradient></defs><style>.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.serif{font-family:Georgia,"Times New Roman",serif}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.card{animation:in 1s cubic-bezier(.16,1,.3,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.4s}.d3{animation-delay:.65s}.trace{stroke-dasharray:240 1200;stroke-dashoffset:1440;animation:trace 6s linear infinite}@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes trace{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.card{animation:none}.trace{display:none}}</style><rect width="1200" height="260" rx="20" fill="url(#bg)"/><rect x=".5" y=".5" width="1199" height="259" rx="19.5" fill="none" stroke="#c77b9b" stroke-opacity=".18"/><path d="M210 78H990" stroke="url(#wire)" stroke-opacity=".55" stroke-dasharray="5 8"><animate attributeName="stroke-dashoffset" from="0" to="-52" dur="5s" repeatCount="indefinite"/></path><circle cx="210" cy="78" r="5" fill="#e5b5c7"><animate attributeName="opacity" values=".5;1;.5" dur="2s" repeatCount="indefinite"/></circle><circle cx="600" cy="78" r="5" fill="#e5b5c7"><animate attributeName="opacity" values=".5;1;.5" dur="2s" begin=".7s" repeatCount="indefinite"/></circle><circle cx="990" cy="78" r="5" fill="#e5b5c7"><animate attributeName="opacity" values=".5;1;.5" dur="2s" begin="1.4s" repeatCount="indefinite"/></circle><g class="card d1" transform="translate(32 34)"><rect width="360" height="195" rx="14" fill="#190b12" stroke="#c77b9b" stroke-opacity=".32"/><rect class="trace" width="360" height="195" rx="14" fill="none" stroke="url(#trace)" stroke-width="1.5"/><text class="mono" x="24" y="37" font-size="10.5" letter-spacing="2" fill="#c77b9b">01 · START WITH THE PROBLEM</text><text class="serif" x="24" y="91" font-size="29" fill="#f8f0f3">Understand the user</text><text class="sans" x="24" y="128" font-size="14" fill="#b6a3ac">Make the real workflow easier to</text><text class="sans" x="24" y="151" font-size="14" fill="#b6a3ac">see before reaching for a solution.</text><text class="mono" x="24" y="179" font-size="10" fill="#e5b5c7">LISTEN → MAP → DESIGN</text></g><g class="card d2" transform="translate(420 34)"><rect width="360" height="195" rx="14" fill="#190b12" stroke="#c77b9b" stroke-opacity=".32"/><rect class="trace" style="animation-delay:-2s" width="360" height="195" rx="14" fill="none" stroke="url(#trace)" stroke-width="1.5"/><text class="mono" x="24" y="37" font-size="10.5" letter-spacing="2" fill="#c77b9b">02 · BUILD WITH CLARITY</text><text class="serif" x="24" y="91" font-size="29" fill="#f8f0f3">Make it useful</text><text class="sans" x="24" y="128" font-size="14" fill="#b6a3ac">Keep interfaces understandable, and</text><text class="sans" x="24" y="151" font-size="14" fill="#b6a3ac">be clear about a prototype's limits.</text><text class="mono" x="24" y="179" font-size="10" fill="#e5b5c7">BUILD → TEST → REFINE</text></g><g class="card d3" transform="translate(808 34)"><rect width="360" height="195" rx="14" fill="#190b12" stroke="#c77b9b" stroke-opacity=".32"/><rect class="trace" style="animation-delay:-4s" width="360" height="195" rx="14" fill="none" stroke="url(#trace)" stroke-width="1.5"/><text class="mono" x="24" y="37" font-size="10.5" letter-spacing="2" fill="#c77b9b">03 · STAY CURIOUS</text><text class="serif" x="24" y="91" font-size="29" fill="#f8f0f3">Learn by shipping</text><text class="sans" x="24" y="128" font-size="14" fill="#b6a3ac">Every project is a chance to improve</text><text class="sans" x="24" y="151" font-size="14" fill="#b6a3ac">the craft and explore what's possible.</text><text class="mono" x="24" y="179" font-size="10" fill="#e5b5c7">TRY → LEARN → GROW</text></g></svg>