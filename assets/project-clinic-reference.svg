<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="t d"><title id="t">Clinic Queue and Patient Flow Manager</title><desc id="d">Role-based clinic app: patients get visit tokens and waiting estimates; staff monitor queues; doctors serve patients sequentially. The demo uses temporary simulated data.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#190b12"/><stop offset="1" stop-color="#10070c"/></linearGradient><radialGradient id="glow" cx="82%" cy="30%" r="55%"><stop stop-color="#701a3d" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#c77b9b" stroke-opacity=".07"/></pattern><linearGradient id="trace" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5f7"/><stop offset=".45" stop-color="#e5b5c7"/><stop offset="1" stop-color="#c77b9b" stop-opacity="0"/></linearGradient><filter id="glowf"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>.serif{font-family:Georgia,"Times New Roman",serif}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.in{animation:in 1.2s cubic-bezier(.16,1,.3,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.4s}.chip{animation:chip .7s cubic-bezier(.34,1.56,.64,1) both}.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2s cubic-bezier(.65,0,.35,1) .5s forwards}.trace{stroke-dasharray:564 3136;stroke-dashoffset:3700;animation:trace 7s linear infinite}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes chip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes trace{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.in,.chip{animation:none}.draw{animation:none;stroke-dashoffset:0}.trace{display:none}}</style><g><rect width="1200" height="370" rx="18" fill="url(#bg)"/><rect x="720" width="480" height="370" fill="url(#grid)"/><rect width="1200" height="370" rx="18" fill="url(#glow)"/><g class="in d1"><text class="mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#c77b9b">01 · HEALTHCARE WORKFLOW · JAVASCRIPT</text><text class="serif" x="54" y="126" font-size="49" font-weight="300" fill="#f8f0f3">Clinic Queue Manager</text><text class="sans" x="56" y="166" font-size="16" fill="#b6a3ac">A clear queue for patients, clinic staff and doctors.</text><text class="mono" x="56" y="200" font-size="12" fill="#e5b5c7"><tspan fill="#c77b9b">BUILT ›</tspan> visit tokens · queue positions · estimated waiting time</text><path class="draw" d="M56 226H680" fill="none" stroke="#c77b9b" stroke-opacity=".4"/><g transform="translate(56 266)"><text class="serif" font-size="28" fill="#f8f0f3">3 views</text><text class="sans" y="24" font-size="12" fill="#b6a3ac">patient · staff · doctor</text></g><g transform="translate(261 266)"><text class="serif" font-size="28" fill="#f8f0f3">Live queue</text><text class="sans" y="24" font-size="12" fill="#b6a3ac">rule-based updates</text></g><g transform="translate(466 266)"><text class="serif" font-size="28" fill="#f8f0f3">Session</text><text class="sans" y="24" font-size="12" fill="#b6a3ac">simulated data only</text></g><g class="chip" style="animation-delay:1s"><rect x="56" y="314" width="86" height="26" rx="13" fill="#27101c" stroke="#c77b9b" stroke-opacity=".35"/><text class="mono" x="99" y="331" text-anchor="middle" font-size="11" fill="#e5b5c7">JavaScript</text></g><g class="chip" style="animation-delay:1.15s"><rect x="150" y="314" width="66" height="26" rx="13" fill="#27101c" stroke="#c77b9b" stroke-opacity=".35"/><text class="mono" x="183" y="331" text-anchor="middle" font-size="11" fill="#e5b5c7">HTML</text></g><g class="chip" style="animation-delay:1.3s"><rect x="224" y="314" width="59" height="26" rx="13" fill="#27101c" stroke="#c77b9b" stroke-opacity=".35"/><text class="mono" x="253" y="331" text-anchor="middle" font-size="11" fill="#e5b5c7">CSS</text></g></g><g class="in d2"><text class="mono" x="760" y="73" font-size="10.5" letter-spacing="2" fill="#b6a3ac">PATIENT · STAFF · DOCTOR</text><g transform="translate(780 104)" class="mono" font-size="11"><rect width="354" height="194" rx="14" fill="#10070c" stroke="#c77b9b" stroke-opacity=".38"/><rect x="18" y="20" width="318" height="37" rx="8" fill="#27101c" stroke="#c77b9b" stroke-opacity=".4"/><circle cx="37" cy="38" r="5" fill="#e5b5c7"/><text x="52" y="42" fill="#f8f0f3">Now serving</text><text x="310" y="42" text-anchor="end" fill="#e5b5c7">#08</text><text x="20" y="84" fill="#c77b9b">NEXT IN QUEUE</text><path d="M20 97H334" stroke="#c77b9b" stroke-opacity=".25"/><g fill="#b6a3ac"><text x="20" y="123">#09</text><text x="86" y="123">Appointment</text><text x="324" y="123" text-anchor="end">~5 min</text><text x="20" y="151">#10</text><text x="86" y="151">Walk-in</text><text x="324" y="151" text-anchor="end">~10 min</text></g><rect x="20" y="166" width="314" height="4" rx="2" fill="#27101c"/><rect x="20" y="166" width="205" height="4" rx="2" fill="#c77b9b"><animate attributeName="width" values="80;205;80" dur="5s" repeatCount="indefinite"/></rect></g></g><rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#c77b9b" stroke-opacity=".2"/><rect class="trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#trace)" stroke-width="1.6" stroke-linecap="round"/></g></svg>