<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="t d"><title id="t">MedGuard AI — educational medication workflow demo</title><desc id="d">A prototype with synthetic data, role-aware dashboards, and limited explainable checks. It is not a clinical tool or a substitute for professional advice.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#190b12"/><stop offset="1" stop-color="#10070c"/></linearGradient><radialGradient id="glow" cx="82%" cy="30%" r="55%"><stop stop-color="#701a3d" stop-opacity=".62"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#c77b9b" stroke-opacity=".07"/></pattern><linearGradient id="trace" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5f7"/><stop offset=".45" stop-color="#e5b5c7"/><stop offset="1" stop-color="#c77b9b" stop-opacity="0"/></linearGradient></defs><style>.serif{font-family:Georgia,"Times New Roman",serif}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.in{animation:in 1.2s cubic-bezier(.16,1,.3,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.4s}.trace{stroke-dasharray:564 3136;stroke-dashoffset:3700;animation:trace 7s linear infinite}.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2s cubic-bezier(.65,0,.35,1) .5s forwards}.chip{animation:chip .7s cubic-bezier(.34,1.56,.64,1) both}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes trace{to{stroke-dashoffset:0}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes chip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.in,.chip{animation:none}.trace{display:none}.draw{animation:none;stroke-dashoffset:0}}</style><g><rect width="1200" height="370" rx="18" fill="url(#bg)"/><rect x="720" width="480" height="370" fill="url(#grid)"/><rect width="1200" height="370" fill="url(#glow)"/><g class="in d1"><text class="mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#c77b9b">03 · EDUCATIONAL PROTOTYPE · PYTHON</text><text class="serif" x="54" y="126" font-size="52" font-weight="300" fill="#f8f0f3">MedGuard AI</text><text class="sans" x="56" y="166" font-size="16" fill="#b6a3ac">Exploring medication workflows with synthetic demo data.</text><text class="mono" x="56" y="200" font-size="12" fill="#e5b5c7"><tspan fill="#c77b9b">BUILT ›</tspan> role-aware screens · limited explainable checks · sample records</text><path class="draw" d="M56 226H680" fill="none" stroke="#c77b9b" stroke-opacity=".4"/><g transform="translate(56 267)"><text class="serif" font-size="27" fill="#f8f0f3">Role-aware</text><text class="sans" y="23" font-size="12" fill="#b6a3ac">demo dashboards</text></g><g transform="translate(261 267)"><text class="serif" font-size="27" fill="#f8f0f3">Explainable</text><text class="sans" y="23" font-size="12" fill="#b6a3ac">bounded rule checks</text></g><g transform="translate(466 267)"><text class="serif" font-size="27" fill="#f8f0f3">Synthetic</text><text class="sans" y="23" font-size="12" fill="#b6a3ac">sample records only</text></g><g class="chip" style="animation-delay:1s"><rect x="56" y="316" width="68" height="26" rx="13" fill="#27101c" stroke="#c77b9b" stroke-opacity=".35"/><text class="mono" x="90" y="333" text-anchor="middle" font-size="11" fill="#e5b5c7">Python</text></g><g class="chip" style="animation-delay:1.15s"><rect x="132" y="316" width="67" height="26" rx="13" fill="#27101c" stroke="#c77b9b" stroke-opacity=".35"/><text class="mono" x="165" y="333" text-anchor="middle" font-size="11" fill="#e5b5c7">SQLite</text></g></g><g class="in d2"><text class="mono" x="805" y="74" font-size="10.5" letter-spacing="2" fill="#b6a3ac">DEMO SAFETY BOUNDARIES</text><g transform="translate(808 99)"><rect width="326" height="216" rx="14" fill="#10070c" stroke="#c77b9b" stroke-opacity=".38"/><rect x="20" y="20" width="286" height="36" rx="8" fill="#27101c" stroke="#c77b9b" stroke-opacity=".35"/><circle cx="39" cy="38" r="5" fill="#e5b5c7"/><text class="mono" x="54" y="42" font-size="11" fill="#f8f0f3">SCREENING SUMMARY</text><g class="mono" font-size="10.5"><circle cx="30" cy="87" r="8" fill="#451126" stroke="#c77b9b"/><path d="m26 87 3 3 6-7" fill="none" stroke="#e5b5c7" stroke-width="1.5"/><text x="52" y="91" fill="#b6a3ac">Exact-text duplicate check</text><circle cx="30" cy="124" r="8" fill="#451126" stroke="#c77b9b"/><path d="m26 124 3 3 6-7" fill="none" stroke="#e5b5c7" stroke-width="1.5"/><text x="52" y="128" fill="#b6a3ac">Record completeness prompt</text><circle cx="30" cy="161" r="8" fill="#27101c" stroke="#e5b5c7"/><text x="30" y="165" text-anchor="middle" fill="#e5b5c7">!</text><text x="52" y="165" fill="#e5b5c7">Unverified risks stay unverified</text></g><path d="M20 183H306" stroke="#c77b9b" stroke-opacity=".28"/><text class="mono" x="20" y="202" font-size="9.5" fill="#e5b5c7">SYNTHETIC DATA · EDUCATIONAL DEMO ONLY</text></g></g><rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#c77b9b" stroke-opacity=".2"/><rect class="trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#trace)" stroke-width="1.6" stroke-linecap="round"/></g></svg>