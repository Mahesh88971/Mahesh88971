<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="245" viewBox="0 0 1200 245" role="img" aria-labelledby="t d"><title id="t">MedGuard AI — Educational medication safety demo</title><desc id="d">A prototype using synthetic data, role-aware dashboards, and limited explainable checks. It is not for clinical use.</desc><defs><linearGradient id="edge" x1="0" x2="1"><stop stop-color="#fbbf24"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs><rect x="1" y="1" width="1198" height="243" rx="17" fill="#171b20" stroke="#44413a"/><rect x="1" y="1" width="6" height="243" rx="3" fill="url(#edge)"/><text x="34" y="37" fill="#fcd34d" font-family="ui-monospace,monospace" font-size="12" letter-spacing="2">03 · EDUCATIONAL PROTOTYPE · PYTHON</text><text x="34" y="78" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="700">MedGuard AI</text><text x="34" y="110" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="15">Synthetic-data workflow demo with role-aware views and limited, explainable checks.</text><text x="34" y="141" fill="#fbbf24" font-family="Arial,sans-serif" font-size="13" font-weight="700">EDUCATIONAL PROTOTYPE — NOT MEDICAL ADVICE OR A CLINICAL SAFETY TOOL.</text><text x="34" y="179" fill="#94a3b8" font-family="Arial,sans-serif" font-size="14">Includes explicit uncertainty where the available demo rules cannot verify a risk.</text><text x="34" y="211" fill="#64748b" font-family="ui-monospace,monospace" font-size="11">PYTHON · SQLITE · SESSION-BASED SAMPLE RECORDS</text><g transform="translate(991 64)"><path d="M77 0 147 25v53c0 41-31 70-70 90C38 148 7 119 7 78V25z" fill="#101d22" stroke="#34d399" stroke-width="2"/><path d="m47 86 20 19 41-47" fill="none" stroke="#6ee7b7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="stroke-dasharray" values="0 120;120 0" dur="2s" fill="freeze"/></path><text x="77" y="193" fill="#fcd34d" font-family="ui-monospace,monospace" font-size="10" text-anchor="middle">SYNTHETIC DATA ONLY</text></g></svg>
