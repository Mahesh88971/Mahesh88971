<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="t d"><title id="t">S Mahesh Babu — Building with purpose</title><desc id="d">Animated signature with a handwritten reveal, subtle rising light particles and tagline.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#10070c"/><stop offset="1" stop-color="#190b12"/></linearGradient><radialGradient id="glow" cx="50%" cy="100%" r="70%"><stop stop-color="#701a3d" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#701a3d" stop-opacity="0"/><stop offset=".5" stop-color="#c77b9b"/><stop offset="1" stop-color="#701a3d" stop-opacity="0"/></linearGradient></defs><style>.serif{font-family:Georgia,"Times New Roman",serif}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.name{stroke:#e5b5c7;stroke-width:1;fill:#e5b5c7;fill-opacity:0;stroke-dasharray:900;stroke-dashoffset:900;animation:write 3.6s cubic-bezier(.65,0,.35,1) .3s forwards}.rule{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2.4s cubic-bezier(.65,0,.35,1) 1.6s forwards}.enter{animation:fade 1.4s ease 2.6s both}.spark circle{animation:rise 6s ease-in-out infinite}@keyframes write{70%{stroke-dashoffset:0;fill-opacity:0}100%{stroke-dashoffset:0;fill-opacity:1}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes rise{0%{opacity:0;transform:translateY(0)}25%{opacity:.85}100%{opacity:0;transform:translateY(-125px)}}@media(prefers-reduced-motion:reduce){.name{animation:none;stroke-dashoffset:0;fill-opacity:1}.rule{animation:none;stroke-dashoffset:0}.enter{animation:none}.spark{display:none}}</style><rect width="1200" height="230" rx="20" fill="url(#bg)"/><rect width="1200" height="230" rx="20" fill="url(#glow)"/><g class="spark" fill="#e5b5c7" opacity=".8"><circle cx="180" cy="225" r="1.3" style="animation-delay:.3s"/><circle cx="270" cy="225" r="1.8" style="animation-delay:1.7s"/><circle cx="390" cy="225" r="1.2" style="animation-delay:2.4s"/><circle cx="510" cy="225" r="1.5" style="animation-delay:1s"/><circle cx="680" cy="225" r="1.4" style="animation-delay:3.2s"/><circle cx="820" cy="225" r="1.7" style="animation-delay:.7s"/><circle cx="960" cy="225" r="1.2" style="animation-delay:2s"/><circle cx="1070" cy="225" r="1.6" style="animation-delay:4s"/></g><text class="serif name" x="600" y="104" text-anchor="middle" font-size="76" font-style="italic" font-weight="300" letter-spacing="-1">Mahesh</text><path class="rule" d="M100 134H1100" stroke="url(#line)" stroke-width="1"/><circle cx="600" cy="134" r="3" fill="#fff5f7" class="enter"><animate attributeName="r" values="3;5;3" dur="3.2s" repeatCount="indefinite"/></circle><g class="enter"><text class="serif" x="600" y="176" text-anchor="middle" font-size="20" font-style="italic" fill="#f8f0f3">Building useful things. Learning with every release.</text><text class="mono" x="600" y="206" text-anchor="middle" font-size="11" letter-spacing="3" fill="#b6a3ac">FULL-STACK DEVELOPMENT · PRACTICAL AI</text></g></svg>