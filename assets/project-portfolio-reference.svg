<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="t d"><title id="t">Mahesh Babu Sanka portfolio</title><desc id="d">Animated responsive React and Tailwind portfolio featuring an interactive project gallery and dynamic contact form.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#190b12"/><stop offset="1" stop-color="#10070c"/></linearGradient><radialGradient id="glow" cx="82%" cy="30%" r="55%"><stop stop-color="#701a3d" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/></radialGradient><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#c77b9b" stroke-opacity=".07"/></pattern><linearGradient id="trace" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff5f7"/><stop offset=".45" stop-color="#e5b5c7"/><stop offset="1" stop-color="#c77b9b" stop-opacity="0"/></linearGradient></defs><style>.serif{font-family:Georgia,"Times New Roman",serif}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.in{animation:in 1.2s cubic-bezier(.16,1,.3,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.4s}.trace{stroke-dasharray:564 3136;stroke-dashoffset:3700;animation:trace 7s linear infinite}.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 2s cubic-bezier(.65,0,.35,1) .5s forwards}.chip{animation:chip .7s cubic-bezier(.34,1.56,.64,1) both}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes trace{to{stroke-dashoffset:0}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes chip{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.in,.chip{animation:none}.trace{display:none}.draw{animation:none;stroke-dashoffset:0}}</style><g><rect width="1200" height="370" rx="18" fill="url(#bg)"/><rect x="720" width="480" height="370" fill="url(#grid)"/><rect width="1200" height="370" fill="url(#glow)"/><g class="in d1"><text class="mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#c77b9b">02 · PERSONAL SITE · REACT + TAILWIND CSS</text><text class="serif" x="54" y="126" font-size="52" font-weight="300" fill="#f8f0f3">Developer Portfolio</text><text class="sans" x="56" y="166" font-size="16" fill="#b6a3ac">A responsive home for selected projects and a way to get in touch.</text><text class="mono" x="56" y="200" font-size="12" fill="#e5b5c7"><tspan fill="#c77b9b">BUILT ›</tspan> interactive project gallery · dynamic contact form</text><path class="draw" d="M56 226H680" fill="none" stroke="#c77b9b" stroke-opacity=".4"/><g transform="translate(56 270)"><text class="serif" font-size="28" fill="#f8f0f3">Responsive</text><text class="sans" y="24" font-size="12" fill="#b6a3ac">designed across screen sizes</text></g><g transform="translate(340 270)"><text class="serif" font-size="28" fill="#f8f0f3">Interactive</text><text class="sans" y="24" font-size="12" fill="#b6a3ac">projects · contact</text></g><g class="chip" style="animation-delay:1s"><rect x="56" y="323" width="65" height="26" rx="13" fill="#27101c" stroke="#c77b9b" stroke-opacity=".35"/><text class="mono" x="88" y="340" text-anchor="middle" font-size="11" fill="#e5b5c7">React</text></g><g class="chip" style="animation-delay:1.15s"><rect x="130" y="323" width="125" height="26" rx="13" fill="#27101c" stroke="#c77b9b" stroke-opacity=".35"/><text class="mono" x="192" y="340" text-anchor="middle" font-size="11" fill="#e5b5c7">Tailwind CSS</text></g></g><g class="in d2"><text class="mono" x="768" y="73" font-size="10.5" letter-spacing="2" fill="#b6a3ac">PORTFOLIO · PROJECT GALLERY</text><g transform="translate(770 94)"><rect width="374" height="220" rx="14" fill="#10070c" stroke="#c77b9b" stroke-opacity=".38"/><path d="M14 0h346a14 14 0 0 1 14 14v20H0V14A14 14 0 0 1 14 0" fill="#27101c"/><circle cx="20" cy="17" r="4" fill="#c77b9b"/><circle cx="34" cy="17" r="4" fill="#e5b5c7"/><circle cx="48" cy="17" r="4" fill="#701a3d"/><rect x="18" y="55" width="152" height="144" rx="10" fill="#190b12" stroke="#c77b9b" stroke-opacity=".25"/><rect x="32" y="69" width="124" height="66" rx="7" fill="#27101c"/><path d="M42 119l28-28 22 17 20-23 32 32" fill="none" stroke="#c77b9b" stroke-width="2"/><rect x="32" y="147" width="86" height="7" rx="3" fill="#e5b5c7" opacity=".8"/><rect x="32" y="163" width="111" height="5" rx="2" fill="#5b4653"/><rect x="187" y="55" width="169" height="66" rx="10" fill="#190b12" stroke="#c77b9b" stroke-opacity=".25"/><text class="mono" x="202" y="79" font-size="9" fill="#c77b9b">PROJECTS</text><rect x="202" y="91" width="112" height="7" rx="3" fill="#e5b5c7" opacity=".7"/><rect x="187" y="133" width="169" height="66" rx="10" fill="#190b12" stroke="#c77b9b" stroke-opacity=".25"/><text class="mono" x="202" y="157" font-size="9" fill="#c77b9b">LET'S CONNECT</text><rect x="202" y="169" width="138" height="18" rx="8" fill="#451126" stroke="#c77b9b" stroke-opacity=".5"><animate attributeName="stroke-opacity" values=".25;.85;.25" dur="3.5s" repeatCount="indefinite"/></rect></g></g><rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#c77b9b" stroke-opacity=".2"/><rect class="trace" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#trace)" stroke-width="1.6" stroke-linecap="round"/></g></svg>