name: Update contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution graph snake
        uses: Platane/snk@v3
        with:
          github_user_name: Mahesh88971
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%235eead4&color_dots=%23161b22%2C%230d4429%2C%2326a641%2C%2339d353%2C%236eff8b
            dist/github-contribution-grid-snake-dark.svg?color_snake=%235eead4&color_dots=%23161b22%2C%230d4429%2C%2326a641%2C%2339d353%2C%236eff8b

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}